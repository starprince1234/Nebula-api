name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync and deploy on server
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.x'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install SSH transfer tools
        run: |
          command -v sshpass >/dev/null || sudo apt-get install --yes --no-install-recommends sshpass

      - name: Verify generated Go code and backend
        run: |
          go generate ./internal/infrastructure/db/ent
          git diff --exit-code
          go test ./...
          go vet ./...

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Sync source and deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          bash scripts/fetch-deploy-credentials.sh bash scripts/ci-deploy.sh

      - name: Verify public API health
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 5 \
            --connect-timeout 5 \
            --max-time 15 \
            https://api.lyn91r.cn/health/ready >/dev/null
